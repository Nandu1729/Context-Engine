name: Offline qualification (manual, no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    name: offline (${{ matrix.os }}, ${{ matrix.scope }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            scope: full suite
          - os: macos-latest
            scope: full suite
          - os: windows-latest
            scope: portable suite; POSIX runners excluded
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      # Match historical UTF-8 fixture decoding on every platform.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.16"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/brain.py index
      - run: uv run python scripts/brain.py check
      - run: uv run python scripts/platform_check.py --output output/ci-platform.json
      # D090: exactly 17 frozen POSIX-runner modules excluded on Windows only.
      # tests/conftest.py prints every exclusion; product failures still fail CI.
      - name: Tests — ${{ matrix.scope }}
        run: uv run python -m pytest -q --tb=short
      - run: uv run python scripts/operations_check.py --output output/ci-operations.json
      - run: uv build --no-sources
