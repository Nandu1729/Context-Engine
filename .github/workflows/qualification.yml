name: Offline qualification (manual, no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.16"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --all-extras
      - run: uv run python scripts/brain.py index
      - run: uv run python scripts/brain.py check
      - run: uv run python scripts/platform_check.py --output output/ci-platform.json
      # Full collection intentionally exposes portability gaps; no platform skips.
      - run: uv run python -m pytest -q --tb=short
      - run: uv run python scripts/operations_check.py --output output/ci-operations.json
      - run: uv build --no-sources
