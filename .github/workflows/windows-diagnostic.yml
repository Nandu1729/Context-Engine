name: Windows verification (complete portable suite, no deployment)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    name: Windows portable tests — complete suite
    runs-on: windows-latest
    # Allow setup, three bounded probes, the suite and cleanup to finish.
    timeout-minutes: 25
    env:
      # Frozen UTF-8 fixtures use Python's default text encoding.
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: "0.11.16"
          python-version: "3.12.13"
          enable-cache: false
      - run: uv sync --locked --all-extras
      - name: Credential ACL and file-boundary probe (real Windows permissions)
        timeout-minutes: 2
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run python -m pytest -vv --tb=short --capture=tee-sys tests/test_windows_credentials.py tests/test_free_tier.py tests/test_gemini_preflight.py tests/test_service.py -k "credential or acl or key_file or private_file_boundaries or live_cli_preflight or private_regular_bounded_file or private_config_loader"
      - name: Storage concurrency probe (unchanged correctness assertions)
        timeout-minutes: 2
        env:
          PYTHONUNBUFFERED: "1"
        # Recheck the admission repair and expose all three related race results.
        # No retries or extra exclusions; stop the job if this probe fails.
        run: uv run python -m pytest -vv --tb=short --capture=tee-sys tests/test_control_admissions.py tests/test_c09_bounds.py -k "admission or concurrent or pin_race or storage_diagnostics"
      - name: SQLite ACL and journal probe (real Windows permissions)
        timeout-minutes: 2
        env:
          PYTHONUNBUFFERED: "1"
        run: uv run python -m pytest -vv --tb=short --capture=tee-sys tests/test_windows_storage.py tests/test_memory.py::test_private_schema_and_journal_boundaries tests/test_memory.py::test_restore_rotates_epoch_and_preserves_originals tests/test_providers.py::test_private_files_symlinks_and_estimate_overrun
      - name: Complete portable suite (report all failures)
        # c6b82fc: 849 tests passed with continued progress before the old 7m cap.
        # Keep a finite limit and report slow tests before considering tuning.
        timeout-minutes: 15
        env:
          PYTHONUNBUFFERED: "1"
        # D090's exact POSIX exclusions remain; no new skips or live API calls.
        # Verbose names identify the last test even if teardown hangs.
        # tee-sys retains assertion output while showing Python output live.
        run: uv run python -m pytest -vv --tb=short --capture=tee-sys --durations=25 --durations-min=1
